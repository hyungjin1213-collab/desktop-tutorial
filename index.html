<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>About Bio - Korea Bio Map</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at center,#0b1230 0%,#030611 55%,#000 100%);font-family:Arial,sans-serif;color:#fff}
    #graph{position:fixed;inset:0}
    .panel{position:fixed;top:14px;left:14px;z-index:20;background:rgba(3,7,18,.72);backdrop-filter:blur(10px);padding:12px 14px;border:1px solid rgba(255,255,255,.10);border-radius:14px;max-width:290px;pointer-events:none}
    .panel h1{font-size:18px;margin:0 0 4px}.panel p{font-size:12px;color:#9aa7c7;margin:0 0 7px}
    .legend{font-size:12px;line-height:1.55;color:#d7def0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
    .lines{font-size:11.5px;line-height:1.7;color:#d7def0;margin:0 0 8px}
    .line{display:inline-block;width:22px;margin-right:6px;vertical-align:middle;border-radius:2px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;box-shadow:0 0 8px currentColor}
    .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;font-size:11px;color:#7f8aa8;background:rgba(3,7,18,.55);padding:6px 9px;border-radius:999px;pointer-events:none;white-space:nowrap}
    .side{position:fixed;top:14px;right:14px;z-index:21;width:300px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:rgba(3,7,18,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.10);border-radius:14px;overflow:hidden}
    .side[hidden]{display:none}
    .tabs{display:flex;gap:4px;padding:8px 8px 0}
    .tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:#9aa7c7;font:600 13px Arial,sans-serif;padding:7px 4px;cursor:pointer}
    .tabs button.on{color:#fff;border-bottom-color:#fbbf24}
    .tabs .fold{flex:0 0 30px;font-size:16px}
    .pane{display:flex;flex-direction:column;min-height:0;padding:8px}
    .pane[hidden]{display:none}
    .side input,.side select{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;font-size:13px;padding:8px 10px;outline:none}
    .side input:focus,.side select:focus{border-color:#fbbf24}
    .side select option{background:#0b1230}
    .filters{display:flex;gap:6px}
    .list{list-style:none;margin:8px 0 0;padding:0;overflow-y:auto;max-height:calc(100vh - 190px)}
    .row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;cursor:pointer}
    .row:hover,.row.active{background:rgba(255,255,255,.08)}
    .rank{flex:0 0 24px;text-align:right;font-weight:700;color:#fbbf24;font-size:13px}
    .who{flex:1;min-width:0}
    .who b{font-size:13px}.who small{display:block;color:#9aa7c7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .val{flex:0 0 auto;font-size:12px;color:#d7def0}
    .badge{display:inline-block;min-width:16px;margin-left:4px;padding:0 4px;border-radius:999px;background:#fbbf24;color:#111;font-size:11px}
    .badge[hidden]{display:none}
    .filter-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9aa7c7}
    .reset{background:none;border:1px solid rgba(255,255,255,.2);color:#d7def0;border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
    .fgroup h4{margin:12px 0 6px;font-size:12px;color:#9aa7c7;font-weight:600}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:12px;color:#d7def0;cursor:pointer;user-select:none}
    .chip input{display:none}
    .chip.on{background:rgba(251,191,36,.16);border-color:#fbbf24;color:#fff}
    .chip.empty-chip{opacity:.4}
    .chip small{color:#9aa7c7}
    .who small.match{color:#fbbf24}
    .who small.match.tech{color:#5eead4}
    .seg{display:flex;gap:4px;margin-top:6px}
    .seg button{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#9aa7c7;border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer}
    .seg button.on{color:#fff;border-color:#fbbf24;background:rgba(251,191,36,.12)}
    .kw{color:#c7d2fe}
    .empty{color:#7f8aa8;font-size:12px;padding:10px 6px}
    .open-side{position:fixed;top:14px;right:14px;z-index:21;background:rgba(3,7,18,.78);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 13px;font:600 13px Arial,sans-serif;cursor:pointer}
    .open-side[hidden]{display:none}
    @media (max-width:640px){
      .panel{max-width:calc(100vw - 150px);padding:9px 11px}
      .panel .lines,.panel .legend,.panel p{display:none}
      .panel h1{font-size:15px;margin:0}
      .side{top:auto;bottom:52px;left:10px;right:10px;width:auto;max-height:52vh}
      .list{max-height:calc(52vh - 110px)}
      .hint{display:none}
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Korea Bio Map · 3D</h1>
    <p>교수 = 별 · score = 별 크기 · 색 = 분야</p>
    <div class="lines">
      <div><span class="line" style="background:#fbbf24;height:3px"></span>지도교수 → 제자 (PI 10점 · 제자 1점)</div>
      <div><span class="line" style="background:#c084fc;height:2px"></span>포닥 멘토 → 포닥 (PI 3점 · 포닥 1점)</div>
      <div><span class="line" style="background:rgba(147,197,253,.45);height:1px"></span>공동연구 (1명당 1점 · 협업 강도순 밝기 · 별을 누르면 강조)</div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <button class="open-side" id="open-side" hidden>검색 · 순위 · 필터</button>
  <div class="side" id="side">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="search" role="tab">검색</button>
      <button data-tab="rank" role="tab">순위</button>
      <button data-tab="filter" role="tab">필터<span class="badge" id="filter-badge" hidden></span></button>
      <button class="fold" id="fold" aria-label="접기">×</button>
    </div>
    <div class="pane" id="pane-search">
      <input id="q" type="search" placeholder="이름 · 대학 · 분야 · 연구 키워드 (예: T세포)" autocomplete="off" />
      <div class="seg" id="q-mode" role="radiogroup" aria-label="검색 범위">
        <button data-mode="all" class="on">전체</button><button data-mode="topic">연구 분야</button><button data-mode="technique">기술</button>
      </div>
      <ol class="list" id="search-list"></ol>
    </div>
    <div class="pane" id="pane-filter" hidden>
      <div class="filter-head"><span id="filter-count"></span><button class="reset" id="filter-reset">초기화</button></div>
      <div class="list filters-scroll">
        <div class="fgroup"><h4>분야</h4><div class="chips" id="f-category"></div></div>
        <div class="fgroup"><h4>지역</h4><div class="chips" id="f-region"></div></div>
        <div class="fgroup"><h4>기술</h4><div class="chips" id="f-technique"></div></div>
        <div class="fgroup"><h4>직위</h4><div class="chips" id="f-position"></div></div>
        <div class="fgroup"><h4>기타</h4><div class="chips" id="f-extra"></div></div>
      </div>
    </div>
    <div class="pane" id="pane-rank" hidden>
      <div class="filters">
        <select id="rank-by" aria-label="순위 기준">
          <option value="score">종합 점수</option>
          <option value="collaborator_count">공동연구 교수 수</option>
          <option value="faculty_trainee_count">교수가 된 제자 수</option>
        </select>
        <select id="rank-uni" aria-label="대학"></select>
      </div>
      <ol class="list" id="rank-list"></ol>
    </div>
  </div>
  <div class="hint">드래그: 회전 · 두 손가락: 줌 · 별 터치: 정보·공동연구 강조 · 빈 곳 터치: 해제</div>
  <div id="graph"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.76.1/dist/3d-force-graph.min.js"></script>
  <script src="./network-data.js"></script>
  <script>
    // One color per broad field (src/classify.py, data/field_categories.csv).
    const CATEGORY_COLORS={
      "분자·세포생물":"#60a5fa","임상의학":"#f472b6","암·종양":"#fb7185","면역·감염":"#2dd4bf",
      "신경과학":"#a78bfa","약학·신약":"#fbbf24","유전체·생물정보":"#34d399","의공학·바이오소재":"#f97316",
      "생리·대사":"#facc15","보건·역학":"#94a3b8","농생명·식품·생태":"#84cc16","기타":"#e5e7eb"
    };
    const CATEGORY_ORDER=Object.keys(CATEGORY_COLORS);
    const REGION_ORDER=["서울","경기·인천","강원","대전·충청","대구·경북","부산·울산·경남","광주·전라","제주","기타"];
    const POSITION_ORDER=["교수","부교수","조교수","미상"];
    const fieldColor=n=>CATEGORY_COLORS[n.category]||CATEGORY_COLORS["기타"];
    const NODE_COUNT=(window.KOREA_BIO_MAP.nodes||[]).length;
    const SEG=NODE_COUNT>800?8:NODE_COUNT>200?14:24;

    // Names and departments come from scraped university pages: never inject raw.
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    // Collaboration lines are a faint background web; PhD / postdoc lineage
    // lines are the story, drawn bright with arrows (PI -> trainee).
    const LINK_STYLE={
      collaboration:{color:"rgba(147,197,253,0.10)",focus:"rgba(191,219,254,0.85)",width:0,focusWidth:.45,particles:0},
      advisor_student:{color:"#fbbf24",width:1.9,particles:3,particleColor:"#fde68a"},
      postdoc_mentor:{color:"#c084fc",width:1.4,particles:2,particleColor:"#ede9fe"}
    };
    const isLineage=l=>l.type==="advisor_student"||l.type==="postdoc_mentor";
    const endId=v=>typeof v==="object"?v.id:v;
    let focus=null, selected=null;
    const touchesFocus=l=>focus&&(endId(l.source)===focus.id||endId(l.target)===focus.id);
    // Collaboration strength (weighted by team size, seniority and recency;
    // see collaboration_weight in pipeline.py): 0.5 is the drawing threshold.
    const strengthLevel=l=>Math.min((Number(l.strength)||0.5)/3,1);   // 0..1
    function linkColor(l){
      const st=LINK_STYLE[l.type]||LINK_STYLE.collaboration;
      if(isLineage(l)) return st.color;
      const k=strengthLevel(l);
      return touchesFocus(l)
        ? `rgba(191,219,254,${(0.45+0.5*k).toFixed(2)})`
        : `rgba(147,197,253,${(0.05+0.17*k).toFixed(2)})`;
    }
    function linkWidth(l){
      const st=LINK_STYLE[l.type]||LINK_STYLE.collaboration;
      if(isLineage(l)) return st.width;
      return touchesFocus(l)?0.25+0.8*strengthLevel(l):0;
    }
    function setFocus(node){
      if((node&&node.id)===(focus&&focus.id)) return;
      focus=node||null;
      Graph.linkColor(linkColor).linkWidth(linkWidth);  // re-evaluate accessors
    }

    const el=document.getElementById("graph");
    const Graph=ForceGraph3D()(el)
      .width(window.innerWidth)
      .height(window.innerHeight)
      .backgroundColor("rgba(0,0,0,0)")
      .showNavInfo(false)
      .graphData(window.KOREA_BIO_MAP)
      .nodeThreeObject(node=>{
        const group=new THREE.Group();
        const c=fieldColor(node);
        const score=Number(node.score||0);
        const r=2.8+Math.sqrt(score+1)*1.6;

        const core=new THREE.Mesh(
          new THREE.SphereGeometry(r,SEG,SEG),
          new THREE.MeshBasicMaterial({color:c})
        );
        group.add(core);

        const glow=new THREE.Mesh(
          new THREE.SphereGeometry(r*1.9,SEG,SEG),
          new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.14,depthWrite:false})
        );
        group.add(glow);

        if(score>0){
          const halo=new THREE.Mesh(
            new THREE.RingGeometry(r*1.35,r*1.5,32),
            new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false})
          );
          halo.rotation.x=Math.PI/2;
          group.add(halo);
        }
        return group;
      })
      .nodeLabel(n=>`<div style="padding:6px 8px"><b>${esc(n.name)}</b>${n.name_en&&n.name_en!==n.name?` (${esc(n.name_en)})`:""}<br>${esc(n.university_ko||n.university)}${n.department?` · ${esc(n.department)}`:""}${n.position?` · ${esc(n.position)}`:""}<br>${esc(n.category||"")}${n.field?` <span style="color:#9aa7c7">(${esc(n.field)})</span>`:""} · ${esc(n.region||"")}<br>Score: ${n.score} · 공동연구 ${n.collaborator_count}명${n.faculty_trainee_count?` · 교수 된 제자 ${n.faculty_trainee_count}`:""}${n.postdoc_PI_count?` · PI 된 포닥 ${n.postdoc_PI_count}`:""}${(n.keywords||[]).length?`<br><span class="kw">연구 분야: ${n.keywords.slice(0,6).map(esc).join(", ")}</span>`:""}${(n.techniques||[]).length?`<br><span class="kw">주요 기술: ${n.techniques.slice(0,4).map(esc).join(", ")}</span>`:""}${n.orcid?`<br>ORCID: ${esc(n.orcid)}`:""}</div>`)
      .linkLabel(l=>isLineage(l)
        ?`<div style="padding:5px 7px">${l.type==="advisor_student"?"지도교수 → 제자":"포닥 멘토 → 포닥"}<br>${l.verified==="auto"?`자동 추정 · 근거 논문 ${l.paper_count}편`:"확인됨"}</div>`
        :`<div style="padding:5px 7px">공동연구 · 논문 ${l.paper_count}편${l.last_year?` · 최근 ${l.last_year}년`:""}<br>협업 강도 ${(Number(l.strength)||0).toFixed(2)}</div>`)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .linkOpacity(1)
      .linkDirectionalArrowLength(l=>isLineage(l)?4.5:0)
      .linkDirectionalArrowRelPos(.92)
      .linkDirectionalArrowColor(l=>LINK_STYLE[l.type]?.color||"#fff")
      .linkDirectionalParticles(l=>LINK_STYLE[l.type]?.particles||0)
      .linkDirectionalParticleWidth(l=>isLineage(l)?2.2:0)
      .linkDirectionalParticleSpeed(.004)
      .linkDirectionalParticleColor(l=>LINK_STYLE[l.type]?.particleColor||"#fff")
      .onNodeHover(node=>{
        if(!selected){setFocus(node);}
        el.style.cursor=node?"pointer":"default";
      })
      .onBackgroundClick(()=>{selected=null;setFocus(null);markActive(null);})
      .onNodeClick(node=>flyTo(node));

    function flyTo(node){
      selected=node;setFocus(node);
      Graph.controls().autoRotate=false;
      // Far enough to see the professor's neighbours, not just the star.
      const d=110;
      const len=Math.hypot(node.x||1,node.y||1,node.z||1);
      const ratio=1+d/len;
      Graph.cameraPosition(
        {x:(node.x||0)*ratio,y:(node.y||0)*ratio,z:(node.z||0)*ratio},
        node,
        900
      );
      markActive(node.id);
    }

    Graph.d3Force("charge").strength(-170);
    // Lineage pulls PI and trainees close; collaboration only loosely.
    Graph.d3Force("link")
      .distance(l=>isLineage(l)?28:70)
      .strength(l=>isLineage(l)?.9:.08);
    Graph.cameraPosition({z:115});

    const controls=Graph.controls();
    controls.autoRotate=true;
    controls.autoRotateSpeed=.35;
    controls.enableDamping=true;
    controls.dampingFactor=.08;

    // starfield
    const geo=new THREE.BufferGeometry();
    const pts=[];
    for(let i=0;i<500;i++){
      const radius=180+Math.random()*420;
      const theta=Math.random()*Math.PI*2;
      const phi=Math.acos(2*Math.random()-1);
      pts.push(
        radius*Math.sin(phi)*Math.cos(theta),
        radius*Math.sin(phi)*Math.sin(theta),
        radius*Math.cos(phi)
      );
    }
    geo.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
    const stars=new THREE.Points(
      geo,
      new THREE.PointsMaterial({color:"#dbeafe",size:1.15,transparent:true,opacity:.7,sizeAttenuation:true})
    );
    Graph.scene().add(stars);

    window.addEventListener("resize",()=>{
      Graph.width(window.innerWidth).height(window.innerHeight);
    });
    // ---------- search / ranking panel ----------
    const NODES=window.KOREA_BIO_MAP.nodes||[];
    const uniName=u=>String(u||"").split(";")[0].trim().replace(/\b\w/g,c=>c.toUpperCase());
    const norm=v=>String(v||"").toLowerCase().replace(/\s+/g,"");
    NODES.forEach(n=>{
      n._uni=n.university_ko||uniName(n.university);
      n._hay=norm([n.name,n.name_en,n._uni,n.department,n.field,n.category].join(" "));
      // research terms, best first: position in this list ranks keyword hits
      const TECH_EN=window.KOREA_BIO_MAP.techniques_en||{};
      n._terms=[
        ...(n.keywords||[]).map((t,r)=>({t,r,k:norm(t),kind:"topic"})),
        ...(n.techniques||[]).map((t,r)=>({t,r,k:norm(t+" "+(TECH_EN[t]||"")),kind:"technique"}))
      ];
    });
    const side=document.getElementById("side"), openBtn=document.getElementById("open-side");
    const q=document.getElementById("q"), searchList=document.getElementById("search-list");
    const rankBy=document.getElementById("rank-by"), rankUni=document.getElementById("rank-uni"), rankList=document.getElementById("rank-list");

    function row(n,{rank,value,match}={}){
      const li=document.createElement("li");
      li.className="row";li.dataset.id=n.id;
      li.innerHTML=`${rank!==undefined?`<span class="rank">${rank}</span>`:""}
        <span class="who"><b>${esc(n.name)}</b>${n.name_en&&n.name_en!==n.name?` <small style="display:inline">${esc(n.name_en)}</small>`:""}
        <small>${esc(n._uni)}${n.department?` · ${esc(n.department)}`:""}${n.category?` · ${esc(n.category)}`:""}</small>
        ${match?`<small class="match${match.kind==="technique"?" tech":""}">${match.kind==="technique"?"기술":"연구 분야"}: ${esc(match.t)}</small>`:""}</span>
        <span class="val">${esc(value??n.score)}</span>`;
      li.addEventListener("click",()=>{
        flyTo(n);
        if(window.matchMedia("(max-width:640px)").matches) setSide(false);
      });
      return li;
    }
    function fill(list,items,emptyText){
      list.replaceChildren(...items);
      if(!items.length){const e=document.createElement("li");e.className="empty";e.textContent=emptyText;list.append(e);}
      if(selected) markActive(selected.id);
    }
    function markActive(id){
      document.querySelectorAll(".row").forEach(r=>r.classList.toggle("active",r.dataset.id===id));
    }

    const SYNONYMS=window.KOREA_BIO_MAP.synonyms||{};
    // Korean words map to English research terms: "T세포" also searches T-Lymphocytes.
    function queryTerms(raw){
      const base=norm(raw);
      const extra=Object.entries(SYNONYMS).filter(([ko])=>norm(ko).includes(base)||base.includes(norm(ko)))
        .flatMap(([,en])=>en.map(norm));
      return [base,...extra].filter(Boolean);
    }
    let qMode="all";
    document.querySelectorAll("#q-mode button").forEach(b=>b.addEventListener("click",()=>{
      qMode=b.dataset.mode;
      document.querySelectorAll("#q-mode button").forEach(x=>x.classList.toggle("on",x===b));
      runSearch();
    }));
    function runSearch(){
      const term=norm(q.value);
      if(!term){fill(searchList,[],`교수 ${NODES.length}명 중에서 이름·대학·학과·분야·연구 키워드로 검색 (예: T세포, 오가노이드, CRISPR)`);return;}
      const terms=queryTerms(q.value);
      const hits=[];
      NODES.forEach(n=>{
        if(n._pass===false) return;
        const byName=n._hay.includes(term);
        let best=null;
        // x.r = rank within its own list (topics / techniques), so a lab's top
        // technique ranks like another lab's top topic keyword.
        n._terms.forEach(x=>{
          if(qMode!=="all"&&x.kind!==qMode) return;
          if(terms.some(t=>x.k.includes(t)||(t.length>3&&t.includes(x.k)))&&(!best||x.r<best.i)) best={i:x.r,t:x.t,kind:x.kind};
        });
        if((byName&&qMode==="all")||best) hits.push({n,byName:byName&&qMode==="all",best});
      });
      hits.sort((a,b)=>(norm(b.n.name)===term)-(norm(a.n.name)===term)
        ||(a.best?a.best.i:99)-(b.best?b.best.i:99)||b.n.score-a.n.score);
      fill(searchList,hits.slice(0,50).map(h=>row(h.n,{match:h.best&&!h.byName?h.best:null})),"검색 결과가 없어요");
    }

    const unis=[...new Set(NODES.map(n=>n._uni).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    rankUni.replaceChildren(new Option("전체 대학",""),...unis.map(u=>new Option(u,u)));
    function runRank(){
      const key=rankBy.value, uni=rankUni.value;
      const items=NODES.filter(n=>n._pass!==false&&(!uni||n._uni===uni))
        .sort((a,b)=>(b[key]||0)-(a[key]||0)||b.score-a.score);
      let rank=0,prev=null;
      const rows=items.slice(0,100).map((n,i)=>{
        const v=n[key]||0;
        if(v!==prev){rank=i+1;prev=v;}  // ties share a rank
        return row(n,{rank,value:v});
      });
      fill(rankList,rows,"표시할 교수가 없어요");
    }


    // ---------- filters ----------
    const nowYear=new Date().getFullYear();
    const lineageIds=new Set(), recentIds=new Set();
    (window.KOREA_BIO_MAP.links||[]).forEach(l=>{
      const a=endId(l.source), b=endId(l.target);
      if(isLineage(l)){lineageIds.add(a);lineageIds.add(b);}
      else if(Number(l.last_year)>=nowYear-5){recentIds.add(a);recentIds.add(b);}
    });
    const EXTRA={
      lineage:{label:"계보(제자·포닥) 있음",test:n=>lineageIds.has(n.id)},
      recent:{label:"최근 5년 공동연구",test:n=>recentIds.has(n.id)},
      verified:{label:"신원 확인됨 (ORCID 등)",test:n=>n.identity==="verified"}
    };
    const FILTERS={category:new Set(),region:new Set(),position:new Set(),technique:new Set(),extra:new Set()};
    const valueOf={category:n=>n.category||"기타",region:n=>n.region||"기타",position:n=>n.position||"미상"};
    const passes=n=>["category","region","position"].every(k=>!FILTERS[k].size||FILTERS[k].has(valueOf[k](n)))
      &&(!FILTERS.technique.size||(n.techniques||[]).some(t=>FILTERS.technique.has(t)))
      &&[...FILTERS.extra].every(k=>EXTRA[k].test(n));

    function chip(group,value,label,count,color){
      const el=document.createElement("label");
      el.className="chip"+(count?"":" empty-chip");
      el.innerHTML=`${color?`<span class="dot" style="background:${color};color:${color}"></span>`:""}<input type="checkbox">${esc(label)} <small>${count}</small>`;
      el.querySelector("input").addEventListener("change",e=>{
        e.target.checked?FILTERS[group].add(value):FILTERS[group].delete(value);
        el.classList.toggle("on",e.target.checked);
        applyFilters();
      });
      return el;
    }
    function buildFilters(){
      const count=(k,v)=>NODES.filter(n=>valueOf[k](n)===v).length;
      document.getElementById("f-category").replaceChildren(...CATEGORY_ORDER.map(v=>chip("category",v,v,count("category",v),CATEGORY_COLORS[v])));
      document.getElementById("f-region").replaceChildren(...REGION_ORDER.map(v=>chip("region",v,v,count("region",v))));
      const techCount={};
      NODES.forEach(n=>(n.techniques||[]).forEach(t=>{techCount[t]=(techCount[t]||0)+1;}));
      const techs=Object.entries(techCount).sort((a,b)=>b[1]-a[1]).slice(0,30);
      document.getElementById("f-technique").replaceChildren(...(techs.length
        ?techs.map(([t,c])=>chip("technique",t,t,c))
        :[Object.assign(document.createElement("span"),{className:"empty",textContent:"다음 수집 후 표시돼요"})]));
      document.getElementById("f-position").replaceChildren(...POSITION_ORDER.map(v=>chip("position",v,v,count("position",v))));
      document.getElementById("f-extra").replaceChildren(...Object.entries(EXTRA).map(([k,x])=>chip("extra",k,x.label,NODES.filter(x.test).length)));
      document.getElementById("legend").replaceChildren(...CATEGORY_ORDER.filter(v=>count("category",v)).map(v=>{
        const d=document.createElement("div");
        d.innerHTML=`<span class="dot" style="background:${CATEGORY_COLORS[v]};color:${CATEGORY_COLORS[v]}"></span>${esc(v)}`;
        return d;
      }));
    }
    function applyFilters(){
      NODES.forEach(n=>{n._pass=passes(n);});
      const shown=NODES.filter(n=>n._pass).length;
      const active=Object.values(FILTERS).reduce((s,x)=>s+x.size,0);
      document.getElementById("filter-count").textContent=`${shown} / ${NODES.length}명 표시 중`;
      const badge=document.getElementById("filter-badge");
      badge.hidden=!active;badge.textContent=active;
      const byId=new Map(NODES.map(n=>[n.id,n]));
      Graph.nodeVisibility(n=>n._pass!==false)
        .linkVisibility(l=>byId.get(endId(l.source))?._pass!==false&&byId.get(endId(l.target))?._pass!==false);
      if(selected&&selected._pass===false){selected=null;setFocus(null);}
      runSearch();runRank();
    }
    document.getElementById("filter-reset").addEventListener("click",()=>{
      Object.values(FILTERS).forEach(x=>x.clear());
      document.querySelectorAll("#pane-filter .chip").forEach(c=>{c.classList.remove("on");c.querySelector("input").checked=false;});
      applyFilters();
    });

    document.querySelectorAll(".tabs [data-tab]").forEach(btn=>btn.addEventListener("click",()=>{
      document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.classList.toggle("on",b===btn));
      document.getElementById("pane-search").hidden=btn.dataset.tab!=="search";
      document.getElementById("pane-rank").hidden=btn.dataset.tab!=="rank";
      document.getElementById("pane-filter").hidden=btn.dataset.tab!=="filter";
    }));
    function setSide(open){side.hidden=!open;openBtn.hidden=open;if(open&&!document.getElementById("pane-search").hidden)q.focus({preventScroll:true});}
    document.getElementById("fold").addEventListener("click",()=>setSide(false));
    openBtn.addEventListener("click",()=>setSide(true));
    q.addEventListener("input",runSearch);
    q.addEventListener("keydown",e=>{if(e.key==="Enter"){const first=searchList.querySelector(".row");if(first)first.click();}});
    rankBy.addEventListener("change",runRank);
    rankUni.addEventListener("change",runRank);
    buildFilters();applyFilters();
    if(window.matchMedia("(max-width:640px)").matches) setSide(false);
  </script>
</body>
</html>
