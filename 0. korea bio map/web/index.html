<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About Bio - Korea Bio Map</title>
  <style>
    html,body{margin:0;height:100%;background:#050814;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #graph{width:100vw;height:100vh}
    .panel{position:absolute;top:16px;left:16px;z-index:10;background:rgba(8,12,28,.78);backdrop-filter:blur(8px);padding:14px 16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;max-width:320px}
    .panel h1{font-size:18px;margin:0 0 6px}.panel p{font-size:12px;color:#aab4d0;margin:0 0 8px}
    .legend{font-size:12px;line-height:1.6;color:#d9e1f2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  </style>
</head>
<body>
  <div class="panel">
    <h1>Korea Bio Map · Prototype</h1>
    <p>교수 = 별 · 공동연구 = 선 · score = 별 크기</p>
    <div class="legend">
      <div><span class="dot" style="background:#2dd4bf"></span>면역항암</div>
      <div><span class="dot" style="background:#60a5fa"></span>합성생물학</div>
      <div><span class="dot" style="background:#f59e0b"></span>세포치료</div>
      <div><span class="dot" style="background:#c084fc"></span>의료용 고분자</div>
    </div>
  </div>
  <div id="graph"></div>

  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/three-spritetext"></script>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <script src="./network-data.js"></script>
  <script>
    const fieldColor = {
      "면역항암":"#2dd4bf",
      "합성생물학":"#60a5fa",
      "세포치료":"#f59e0b",
      "의료용 고분자":"#c084fc",
      "체외면역 평가":"#fb7185"
    };

    const Graph = ForceGraph3D()(document.getElementById("graph"))
      .backgroundColor("#050814")
      .graphData(window.KOREA_BIO_MAP)
      .nodeVal(n => 4 + Math.sqrt(Number(n.score || 0)) * 4)
      .nodeColor(n => fieldColor[n.field] || "#e5e7eb")
      .nodeOpacity(0.95)
      .linkColor(l => l.type === "collaboration" ? "#60a5fa" : "#fbbf24")
      .linkWidth(l => 0.8 + Math.min(Number(l.paper_count || 1), 6) * 0.25)
      .linkOpacity(0.45)
      .nodeLabel(n => `
        <b>${n.name}</b><br/>
        ${n.university}<br/>
        ${n.field}<br/>
        Score: ${n.score}<br/>
        Collaborators: ${n.collaborator_count}
      `)
      .nodeThreeObjectExtend(true)
      .nodeThreeObject(n => {
        const sprite = new SpriteText(n.name);
        sprite.material.depthWrite = false;
        sprite.color = "#ffffff";
        sprite.textHeight = 4;
        sprite.position.y = 8;
        return sprite;
      });

    Graph.d3Force("charge").strength(-120);
    Graph.d3Force("link").distance(45);
    Graph.cameraPosition({ z: 230 });

    Graph.onNodeClick(node => {
      const distance = 70;
      const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
      Graph.cameraPosition(
        { x:(node.x||0)*distRatio, y:(node.y||0)*distRatio, z:(node.z||0)*distRatio },
        node,
        1200
      );
    });
  </script>
</body>
</html>
